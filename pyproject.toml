[project]
name = "marvin-integration-slack"
version = "0.2.0"
description = "Slack integration for Marvin — post messages to a channel via an incoming webhook."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["marvin-integration-sdk>=0.2,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

# This is the seam that makes the plugin discoverable: an installed Marvin scans this group at
# startup and registers whatever providers it finds. No core or frontend changes needed.
[project.entry-points."marvin.integrations"]
slack = "marvin_integration_slack:SlackProvider"

# Dev only: resolve the SDK from the sibling checkout. Released builds take it from the index.
[tool.uv.sources]
marvin-integration-sdk = { path = "../MarvinIntegrationSDK", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_integration_slack"]

[tool.ruff]
line-length = 150
target-version = "py311"
